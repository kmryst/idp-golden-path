version: 2
# 有効な ignore の横断一覧: https://github.com/search?q=user%3Akmryst+label%3Adependabot-ignore+is%3Aissue+is%3Aopen&type=issues
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"

  # backstage/ は Yarn workspaces。yarn.lock のあるルート 1 エントリで
  # packages/* / plugins/* の全 workspace がカバーされる
  # （package-ecosystem は Yarn でも "npm" のままでよい）
  - package-ecosystem: "npm"
    directory: "/backstage"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # react / react-dom / react-router 等は密結合しており、単独更新すると
      # 相方が取り残されて CI が壊れる（PR #53 / #54 / #56 で発生）。
      # 1 グループにまとめて 1 PR で更新されるようにする。
      # Dependabot は「複数グループにマッチする依存は最初にマッチした
      # グループに入る」（first-match-wins）ため、@types/react* を npm-dev では
      # なく react グループに入れるべく、react グループを npm-dev より前に置く。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "react-router-*"
          - "@types/react"
          - "@types/react-dom"
      # @backstage/* は prod / dev 問わず同じ backstage/yarn.lock を触るため、
      # 1件ずつ別PRになると1件マージするたびに残り全部が rebase 必要になる
      # （Issue #149 で実測: 同時に5件の @backstage/* patch 更新PRが競合）。
      # 1グループにまとめて1PRで更新されるようにする。
      # dependency-type は指定しない。@backstage/plugin-techdocs-backend 等の
      # prod dependencies 側の Backstage パッケージも同じグループに入れるため。
      # react グループと同じ理由で first-match-wins の順序制約があるため、
      # このグループは react グループより後、npm-dev グループより前に置く。
      # npm-dev より後ろに置くと、@backstage/cli のような devDependencies 側の
      # Backstage パッケージが先に npm-dev にマッチして吸われ、グループが再び分裂する。
      backstage:
        patterns:
          - "@backstage/*"
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # typescript 7 は、本リポジトリの Yarn 4.13.0 では lockfile 更新の時点で失敗する。
      # 組み込みパッチ compat/typescript が TS7 に無い lib/_tsc.js を探して ENOENT になる
      # （peer 範囲違反ではない。上流修正は yarnpkg/berry#7190、Yarn 4.17.1）。
      # Yarn を上げても、@typescript-eslint/* 8.x の peer が typescript <6.1.0 で
      # TS7 の JS API 非公開に未対応のため lint:all が落ちる（typescript-eslint#10940）。
      # 実測: Dependabot run 37247087537 / 37269492519 で typescript だけ skip され run が failure。
      # 実測: Yarn 4.18.1 で TS7 を入れると tsc / test は exit 0、lint:all / build:all は exit 1。
      # 影響: npm-dev グループの他パッケージ（PR #274）は更新されるが run が毎回赤になる。
      # 本番影響なし: typescript は devDependency でビルド・型チェック・lint 専用。
      # 解除条件: Yarn 4.17.1 以上、かつ @typescript-eslint/parser の peer が typescript 7 を含み、
      #   かつ build:all が TS7 で通る（rollup-plugin-dts 6.5 以上 + @typescript/typescript6）。
      # 見直し期限: 2026-11-02（3 リポジトリの Dependabot ignore の棚卸し時期と揃える）
      # 追跡: Issue #305
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # backstage/templates/service-baseline/skeleton は Scaffolder の雛形で、
  # 生成先リポジトリにそのまま展開される独立した npm プロジェクト
  # （固有の package.json / package-lock.json を持つ）。
  # backstage/package.json の workspaces は packages/* / plugins/* だけで
  # templates/ を含まないため、上の /backstage エントリ（yarn.lock 1 本）では
  # skeleton の lockfile に一切届かない。別エントリが要る。
  # /backstage に directories で相乗りさせない理由:
  #   - open-pull-requests-limit がディレクトリ間で共有され、@backstage/* の
  #     大量更新に skeleton の PR 枠が食われる
  #   - react / backstage グループは skeleton には無関係で、
  #     読み手に「skeleton にも効いている」と誤読させる
  # エントリが無い間も security update だけは Dependabot が出すため
  # （PR #201 = fast-uri が実例）、「alert は来るのに通常更新は来ない」という
  # 非対称な状態になっていた（Issue #205）。
  - package-ecosystem: "npm"
    directory: "/backstage/templates/service-baseline/skeleton"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # skeleton の直接依存は @commitlint/* と markdownlint-cli2 の
      # devDependencies だけなので、1 グループ = 1 PR にまとまる
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
