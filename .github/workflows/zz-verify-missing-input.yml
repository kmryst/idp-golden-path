# 検証専用の使い捨て caller。必須 input（image-name）を省略した場合の挙動を実測する。
# main にはマージしない。
name: ZZ Verify Missing Input

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zz-verify-missing-input.yml"

permissions:
  contents: read

jobs:
  missing-input:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy-image.yml
    with:
      docker-context: scripts/ci/fixtures/trivy-image/primary
