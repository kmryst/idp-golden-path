# Dependency Audit
# 目的: 依存関係の既知脆弱性（CVE）を PR / スケジュールで継続的に検出する
# ポリシー: high 以上で fail、moderate 以下は Step Summary での警告のみ（正本: docs/operations/security-scanning.md）
# workflow name は status check（job name）と揃える
# このファイルは本リポジトリの PR チェック（backstage/、Yarn）であると同時に、
# 他リポジトリから `uses: kmryst/idp-golden-path/.github/workflows/dependency-audit.yml@v1`
# で呼び出す reusable workflow でもある（バージョニング方針は ADR-0008）
# 消費側は npm / Yarn いずれかを `package-manager` input で指定する（未指定時は yarn、
# 本リポジトリ自身の既存挙動を維持）。対象ディレクトリは `working-directory` input で指定する
# （未指定時は backstage、本リポジトリ自身の既存挙動を維持）
# npm workspaces 未使用の消費側で root と frontend など複数ディレクトリを監査したい場合は、
# caller 側で working-directory を変えて複数回呼び出すこと（Issue #110）
# 期限付き例外（GHSA + expires + tracking Issue）は npm 消費側が `npm-audit-exceptions`、
# yarn 消費側が `yarn-audit-exceptions` input で宣言する。本リポジトリ自身の yarn 例外は
# scripts/ci/yarn-audit-exceptions.json で宣言する（正本: docs/operations/security-scanning.md、Issue #133）

name: Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 10:30 JST (01:30 UTC)。
    # Dependabot の /backstage 週次実行（.github/dependabot.yml で月曜 09:15 JST、
    # job は 09:38 JST ごろに完了。Issue #291 で実測）の後に Yarn Resolutions Inventory の
    # probe を走らせ、撤去 PR を Dependabot と同じ週 1 回のレビューの流れに乗せるため。
    # 旧: 09:00 JST（Dependabot より前。Issue #291 で変更）
    - cron: "30 1 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      package-manager:
        description: >-
          依存関係監査に使う package manager（`npm` または `yarn`）。
          未指定時は `yarn`（本リポジトリの既定値）を使う
        required: false
        type: string
      working-directory:
        description: >-
          監査対象ディレクトリ。未指定時は `backstage`（本リポジトリの既定値）を使う
        required: false
        type: string
      npm-audit-exceptions:
        description: >-
          npm full audit で一時許可する期限付き GHSA の JSON 配列。
          各要素は id、expires（UTC の YYYY-MM-DD）、tracking（GitHub Issue URL）を必須とする。
          未指定時は例外なし
        required: false
        type: string
        default: "[]"
      yarn-audit-exceptions:
        description: >-
          yarn audit で一時許可する期限付き GHSA の JSON 配列。
          各要素は id、expires（UTC の YYYY-MM-DD）、tracking（GitHub Issue URL）を必須とする。
          未指定時は例外なし。
          本リポジトリ自身の実行（workflow_call 以外）では、input の代わりに
          scripts/ci/yarn-audit-exceptions.json を読む
        required: false
        type: string
        default: "[]"

permissions:
  contents: read

concurrency:
  # 消費側リポジトリの caller workflow は、この group と同一の文字列を使ってはならない。
  # GitHub Actions は workflow_call 経由でも caller/callee 双方の concurrency group を
  # 評価するため、同一名にすると「caller と callee 間のデッドロック」と判定され、
  # job が1つも起動せず run がキャンセルされる（Issue #106）。
  # caller 側は `dependency-audit-caller-<PR番号>` のように区別すること。
  group: dependency-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'backstage' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate dependency audit inputs
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager || 'yarn' }}
          NPM_AUDIT_EXCEPTIONS: ${{ inputs['npm-audit-exceptions'] }}
          YARN_AUDIT_EXCEPTIONS_INPUT: ${{ inputs['yarn-audit-exceptions'] }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm | yarn) ;;
            *)
              echo "::error::package-manager must be npm or yarn"
              exit 1
              ;;
          esac

          if [[ "$PACKAGE_MANAGER" != "npm" &&
                -n "$NPM_AUDIT_EXCEPTIONS" &&
                "$NPM_AUDIT_EXCEPTIONS" != "[]" ]]; then
            echo "::error::npm-audit-exceptions can only be used with package-manager npm"
            exit 1
          fi

          if [[ "$PACKAGE_MANAGER" != "yarn" &&
                -n "$YARN_AUDIT_EXCEPTIONS_INPUT" &&
                "$YARN_AUDIT_EXCEPTIONS_INPUT" != "[]" ]]; then
            echo "::error::yarn-audit-exceptions can only be used with package-manager yarn"
            exit 1
          fi

      # reusable workflow 自身のポリシー評価器（npm / yarn）を単体テストする。
      # 消費側から呼ばれた場合は caller リポジトリにこのテストファイルがないため実行しない。
      - name: Test audit policy evaluators
        if: ${{ github.repository == 'kmryst/idp-golden-path' }}
        working-directory: ${{ github.workspace }}
        run: >-
          node --test
          scripts/ci/npm-audit-policy.test.mjs
          scripts/ci/npm-overrides-audit.test.mjs
          scripts/ci/yarn-audit-policy.test.mjs
          scripts/ci/yarn-resolutions-audit.test.mjs

      - name: Enable Corepack (Yarn 4)
        if: ${{ (inputs.package-manager || 'yarn') == 'yarn' }}
        run: |
          corepack enable
          yarn --version

      # 全 severity のレポート（fail させない可視化用）— yarn
      - name: Audit report (all severities, warn only) [yarn]
        if: ${{ (inputs.package-manager || 'yarn') == 'yarn' }}
        run: |
          {
            echo "## Dependency Audit (all severities)"
            echo ""
            echo '```'
            yarn npm audit --all --recursive || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # yarn の期限付き例外を解決する。優先順位:
      # 1. workflow_call の yarn-audit-exceptions input（yarn 消費側向け）
      # 2. 本リポジトリ自身の実行では scripts/ci/yarn-audit-exceptions.json
      # 3. どちらも無ければ例外なし（従来どおりの素のゲート）
      - name: Resolve yarn audit exceptions
        id: yarn-exceptions
        if: ${{ (inputs.package-manager || 'yarn') == 'yarn' }}
        working-directory: ${{ github.workspace }}
        env:
          YARN_AUDIT_EXCEPTIONS_INPUT: ${{ inputs['yarn-audit-exceptions'] }}
        run: |
          exceptions="[]"
          if [[ -n "$YARN_AUDIT_EXCEPTIONS_INPUT" &&
                "$YARN_AUDIT_EXCEPTIONS_INPUT" != "[]" ]]; then
            exceptions="$YARN_AUDIT_EXCEPTIONS_INPUT"
          elif [[ "$GITHUB_REPOSITORY" == "kmryst/idp-golden-path" &&
                  -f scripts/ci/yarn-audit-exceptions.json ]]; then
            exceptions="$(jq -c . scripts/ci/yarn-audit-exceptions.json)"
          fi

          active=false
          if [[ "$exceptions" != "[]" ]]; then
            active=true
          fi

          {
            echo "active=$active"
            echo "exceptions<<IDP_GOLDEN_PATH_EOF"
            echo "$exceptions"
            echo "IDP_GOLDEN_PATH_EOF"
          } >> "$GITHUB_OUTPUT"

      # high / critical が存在する場合のみ fail させるゲート — yarn（例外なしの既定動作）
      - name: Audit gate (fail on high or critical) [yarn]
        if: >-
          ${{
            (inputs.package-manager || 'yarn') == 'yarn' &&
            steps.yarn-exceptions.outputs.active != 'true'
          }}
        run: yarn npm audit --all --recursive --severity high

      # actions/checkout は reusable workflow の caller を checkout する。
      # 例外評価器は workflow 定義と同じ repository/SHA から取得し、@v1 の実装と一体で固定する。
      # 本リポジトリ自身の実行では checkout 済みの scripts/ci/ をそのまま使う。
      - name: Validate yarn audit policy source
        if: >-
          ${{
            (inputs.package-manager || 'yarn') == 'yarn' &&
            steps.yarn-exceptions.outputs.active == 'true' &&
            github.repository != 'kmryst/idp-golden-path'
          }}
        working-directory: ${{ github.workspace }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ "$WORKFLOW_REPOSITORY" != "kmryst/idp-golden-path" ]]; then
            echo "::error::unexpected reusable workflow repository: $WORKFLOW_REPOSITORY"
            exit 1
          fi

          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reusable workflow SHA is missing or invalid"
            exit 1
          fi

      - name: Checkout yarn audit policy evaluator
        if: >-
          ${{
            (inputs.package-manager || 'yarn') == 'yarn' &&
            steps.yarn-exceptions.outputs.active == 'true' &&
            github.repository != 'kmryst/idp-golden-path'
          }}
        uses: actions/checkout@v7
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .idp-golden-path-workflow
          sparse-checkout: |
            scripts/ci/npm-audit-policy.mjs
            scripts/ci/yarn-audit-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # 環境変数名は YARN_ prefix を避ける（Yarn は YARN_* を設定値として解釈し、
      # 未知の設定名だと yarn npm audit 自体が Usage Error で失敗する）
      - name: Audit gate with expiring advisory exceptions [yarn]
        if: >-
          ${{
            (inputs.package-manager || 'yarn') == 'yarn' &&
            steps.yarn-exceptions.outputs.active == 'true'
          }}
        env:
          IDP_YARN_AUDIT_EXCEPTIONS: ${{ steps.yarn-exceptions.outputs.exceptions }}
        run: |
          script="$GITHUB_WORKSPACE/scripts/ci/yarn-audit-policy.mjs"
          if [[ "$GITHUB_REPOSITORY" != "kmryst/idp-golden-path" ]]; then
            script="$GITHUB_WORKSPACE/.idp-golden-path-workflow/scripts/ci/yarn-audit-policy.mjs"
          fi
          node "$script"

      # 全 severity のレポート（fail させない可視化用）— npm
      # npm audit は package-lock.json のみで動作し、事前の npm ci は不要
      - name: Audit report (all severities, warn only) [npm]
        if: ${{ inputs.package-manager == 'npm' }}
        run: |
          {
            echo "## Dependency Audit (all severities)"
            echo ""
            echo '```'
            npm audit \
              --package-lock=true \
              --package-lock-only=true \
              --include=prod \
              --include=dev \
              --include=optional \
              --include=peer || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # high / critical が存在する場合のみ fail させるゲート — npm
      - name: Audit gate (fail on high or critical) [npm]
        if: >-
          ${{
            inputs.package-manager == 'npm' &&
            (inputs['npm-audit-exceptions'] == '' ||
              inputs['npm-audit-exceptions'] == '[]')
          }}
        run: >-
          npm audit
          --package-lock=true
          --package-lock-only=true
          --include=prod
          --include=dev
          --include=optional
          --include=peer
          --audit-level=high

      # actions/checkout は reusable workflow の caller を checkout する。
      # 例外評価器は workflow 定義と同じ repository/SHA から取得し、@v1 の実装と一体で固定する。
      - name: Validate npm audit policy source
        if: >-
          ${{
            inputs.package-manager == 'npm' &&
            inputs['npm-audit-exceptions'] != '' &&
            inputs['npm-audit-exceptions'] != '[]'
          }}
        working-directory: ${{ github.workspace }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ "$WORKFLOW_REPOSITORY" != "kmryst/idp-golden-path" ]]; then
            echo "::error::unexpected reusable workflow repository: $WORKFLOW_REPOSITORY"
            exit 1
          fi

          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reusable workflow SHA is missing or invalid"
            exit 1
          fi

      - name: Checkout npm audit policy evaluator
        if: >-
          ${{
            inputs.package-manager == 'npm' &&
            inputs['npm-audit-exceptions'] != '' &&
            inputs['npm-audit-exceptions'] != '[]'
          }}
        uses: actions/checkout@v7
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .idp-golden-path-workflow
          sparse-checkout: scripts/ci/npm-audit-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Audit gate with expiring advisory exceptions [npm]
        if: >-
          ${{
            inputs.package-manager == 'npm' &&
            inputs['npm-audit-exceptions'] != '' &&
            inputs['npm-audit-exceptions'] != '[]'
          }}
        env:
          NPM_AUDIT_EXCEPTIONS: ${{ inputs['npm-audit-exceptions'] }}
        run: >-
          node
          "$GITHUB_WORKSPACE/.idp-golden-path-workflow/scripts/ci/npm-audit-policy.mjs"

  # ルート（リポジトリ運用の lint / commitlint ツール）と skeleton（Scaffolder が新規サービスに
  # 配る雛形）の npm 依存グラフの audit ゲート。本リポジトリ固有のチェックであり消費側では実行しない
  # （消費側は package-manager: npm と working-directory input で dependency-audit job を使う）。
  # 本リポジトリ自身は workflow_call の caller を持たないため、Issue #110 が想定した
  # 「caller 側で working-directory を変えて複数回呼び出す」方式は使えない。
  # 代わりに matrix で 2 ディレクトリを独立した job として走らせる。
  # 1 ディレクトリずつ独立させているのは、同一 job の step にすると step の暗黙の success() で
  # 「ルートが落ちている間は skeleton が skip される」従属関係が生まれるため（Issue #255 / #257）。
  # 同じ理由で dependency-audit job への needs: も付けない。
  # 閾値は backstage/（Yarn）と同じく high 以上で fail（正本: docs/operations/security-scanning.md）
  npm-dependency-audit:
    name: npm Dependency Audit (${{ matrix.target.label }})
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path'
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: root
            directory: "."
          - label: skeleton
            directory: backstage/templates/service-baseline/skeleton
    defaults:
      run:
        working-directory: ${{ matrix.target.directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 全 severity のレポート（fail させない可視化用）
      # npm audit は package-lock.json のみで動作し、事前の npm ci は不要
      - name: Audit report (all severities, warn only)
        run: |
          {
            echo "## npm Dependency Audit — ${{ matrix.target.label }} (all severities)"
            echo ""
            echo '```'
            npm audit \
              --package-lock=true \
              --package-lock-only=true \
              --include=prod \
              --include=dev \
              --include=optional \
              --include=peer || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit gate (fail on high or critical)
        run: >-
          npm audit
          --package-lock=true
          --package-lock-only=true
          --include=prod
          --include=dev
          --include=optional
          --include=peer
          --audit-level=high

  # セキュリティ起因 resolutions の台帳（scripts/ci/yarn-resolutions.json）と
  # backstage/package.json の同期検証。本リポジトリ固有のチェックであり消費側では実行しない。
  # yarn-resolutions-inventory と同じ理由で dependency-audit job から独立させている:
  # 台帳同期の検査と audit ゲートは目的が異なり、同一 job に同居させると step の
  # 暗黙の success() によって「audit gate が落ちている間は同期検査も skip される」
  # 従属関係が生まれる（Issue #257）。同じ理由で needs: も付けない。
  # 判定材料はリポジトリ内のファイルだけで再解決コストも無いため、
  # stale と違い PR を含む全実行で走らせる（実行タイミングは切り出し前と同じ）
  yarn-resolutions-registry:
    name: Yarn Resolutions Registry
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path'
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'backstage' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          yarn --version

      - name: Check yarn resolutions registry (sync)
        working-directory: ${{ github.workspace }}
        run: node scripts/ci/yarn-resolutions-audit.mjs sync

  # resolutions の棚卸し: 台帳の resolutions を外した一時プロジェクトで再解決し、
  # advisory が再出現しない resolution（= 不要になったもの）を fail で検出する。
  # 判定材料（上流のリリース）は週次でしか変わらず、依存グラフ全体の再解決コストを
  # 毎 PR で払う価値がないため、schedule / 手動実行に限定する（ADR-0008 追記 2026-08-05）
  #
  # dependency-audit job から独立した job にしているのは、両者の目的・実行タイミング・
  # 失敗の意味が異なるため。audit gate は「今まずい依存が入っていないか」を毎 PR で止めるゲート、
  # 棚卸しは「過去に入れた回避策がまだ必要か」を週次で確かめる処理であり、
  # 同一 job に同居させると step の暗黙の success() によって
  # 「audit gate が落ちている間は棚卸しが丸ごと skip される」従属関係が生まれる（Issue #255）。
  # 同じ理由で needs: も付けない（付けると再び audit gate の失敗に引きずられる）
  #
  # 脆弱性以外の理由の resolutions（scripts/ci/yarn-resolutions-non-security.json）は
  # `probe` を宣言したエントリだけを実測する（Issue #291、ADR-0015）。結果は 3 つに分かれる:
  #   解除可能   = 緑。外す pattern の一覧（removal.json）を artifact に出し、後続の yarn-resolutions-removal-pr が PR を作る
  #   まだ必要   = 緑。何もしない
  #   機構の故障 = 赤（対照の実行や lockfile 再解決の失敗、台帳の誤り）。PR は作らない
  # この job は secret を持たない。yarn の依存解決は未検証の上流パッケージを引くため、
  # 書き込みトークンと同じ job には置かない（PR 作成は次の job に分離）
  yarn-resolutions-inventory:
    name: Yarn Resolutions Inventory
    # 本リポジトリ固有のチェックであり消費側では実行しない
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    # 実測は 30 秒前後（2026-09-14 / 09-21 / 09-28 の schedule 実行）に probe 2 回と
    # lockfile 再解決 1 回（ローカル実測で計 10〜15 秒）が加わる程度。registry 応答の
    # 遅延を見込んでも 15 分あれば足り、既定の 360 分で hang を放置しないための上限
    timeout-minutes: 15
    outputs:
      removal: ${{ steps.stale.outputs.removal }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'backstage' }}
    steps:
      # 依存解決の子プロセスに git の認証ヘッダを渡さない（この job は push しない）
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          yarn --version

      # 環境変数名は YARN_ prefix を避ける（Yarn は YARN_* を設定値として解釈する）
      - name: Check yarn resolutions inventory (stale)
        id: stale
        working-directory: ${{ github.workspace }}
        env:
          IDP_RESOLUTIONS_REMOVAL_DIR: ${{ runner.temp }}/yarn-resolutions-removal
        run: node scripts/ci/yarn-resolutions-audit.mjs stale

      - name: Upload removal changes
        if: ${{ steps.stale.outputs.removal == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: yarn-resolutions-removal
          path: ${{ runner.temp }}/yarn-resolutions-removal
          if-no-files-found: error
          retention-days: 7

  # 解除可能と判定された resolutions の撤去 PR を作る。install は実行せず、
  # 前の job が出した外す pattern の一覧（artifact の removal.json）を許可リストと照合し、
  # 信頼できる checkout から差分と PR 本文を生成して commit / push / PR 作成だけを行う。
  # トークンは GitHub App（kmryst-dependency-bot）の installation token。GITHUB_TOKEN で
  # 作った PR では pull_request トリガーのワークフロー（required status checks）が起動しないため。
  # App の権限は Contents / Pull requests の Read and write のみで、インストール先は本リポジトリだけ。
  # ブランチ名は固定し、再実行しても PR が重複せず既存の PR が更新される
  # （正本: docs/operations/security-scanning.md、設計判断: ADR-0015）
  yarn-resolutions-removal-pr:
    name: Yarn Resolutions Removal PR
    needs: yarn-resolutions-inventory
    # 本リポジトリ固有の処理であり消費側では実行しない。
    # inventory job が失敗（機構の故障）した場合は needs の暗黙の success() で skip される
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path' &&
        needs.yarn-resolutions-inventory.outputs.removal == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download removal changes
        uses: actions/download-artifact@v8
        with:
          name: yarn-resolutions-removal
          path: ${{ runner.temp }}/yarn-resolutions-removal

      # 信頼境界: artifact から受け取るのは removal.json（外す pattern の一覧と lockfile が変わるか）だけ。
      # package.json・台帳・PR 本文はこの job が信頼できる checkout から生成し、pattern は台帳の
      # probe 付きエントリで package.json にも存在するものだけを許可する。removal.json 以外のファイル、
      # 許可外の pattern、余分なフィールドは拒否して赤にする。yarn.lock は PR に含めない
      # （probe job の成果物を信用しない。lockfile が変わる場合は人が yarn install を 1 コミット足す。ADR-0015 選択肢 8）
      - name: Apply authorized removal to the working tree
        id: apply
        env:
          IDP_RESOLUTIONS_REMOVAL_DIR: ${{ runner.temp }}/yarn-resolutions-removal
          IDP_RESOLUTIONS_PR_DIR: ${{ runner.temp }}/yarn-resolutions-pr
        run: |
          node scripts/ci/yarn-resolutions-audit.mjs apply-removal
          echo "title=$(head -n 1 "$IDP_RESOLUTIONS_PR_DIR/pull-request-title.txt")" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat
          # 生成した差分が想定の 2 ファイルに限られることを確認する
          changed="$(git --no-pager diff --name-only | sort | tr '\n' ' ')"
          if [[ "$changed" != "backstage/package.json scripts/ci/yarn-resolutions-non-security.json " ]]; then
            echo "::error::unexpected files changed by apply-removal: $changed"
            exit 1
          fi

      # actions/create-github-app-token v3 は app-id 入力を deprecated にしており、
      # 推奨の client-id（App の Client ID。secret ではない）を variable から渡す
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve GitHub App bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Create or update removal pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: dependency-bot/yarn-resolutions-removal
          delete-branch: true
          add-paths: |
            backstage/package.json
            scripts/ci/yarn-resolutions-non-security.json
          commit-message: ${{ steps.apply.outputs.title }}
          committer: ${{ steps.bot-user.outputs.name }} <${{ steps.bot-user.outputs.email }}>
          author: ${{ steps.bot-user.outputs.name }} <${{ steps.bot-user.outputs.email }}>
          title: ${{ steps.apply.outputs.title }}
          body-path: ${{ runner.temp }}/yarn-resolutions-pr/pull-request-body.md
          labels: |
            type:chore
            area:backstage
            area:ci-cd
            risk:low
            cost:none

      - name: Record pull request
        env:
          OPERATION: ${{ steps.create-pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Yarn resolutions removal pull request"
            echo ""
            echo "- Operation: ${OPERATION:-none}"
            echo "- Pull request: ${PR_URL:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  # セキュリティ起因 npm overrides の台帳（scripts/ci/npm-overrides.json）と、
  # ルート / skeleton の package.json の overrides の同期検証。
  # yarn 側の Yarn Resolutions Registry と同じ位置づけで、本リポジトリ固有のチェックのため
  # 消費側では実行しない。判定材料はリポジトリ内のファイルだけで再解決コストも無いため、
  # stale と違い PR を含む全実行で走らせる。
  # dependency-audit / npm-dependency-audit job から独立させ、needs: も付けない。
  # 同一 job の step にすると step の暗黙の success() により
  # 「audit ゲートが落ちている間は同期検査も skip される」従属関係が生まれる（Issue #255 / #257）
  npm-overrides-registry:
    name: npm Overrides Registry
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check npm overrides registry (sync)
        run: node scripts/ci/npm-overrides-audit.mjs sync

  # npm overrides の棚卸し: 台帳の overrides を外した一時プロジェクトで lockfile を再解決し、
  # advisory が再出現しない overrides（= 不要になったもの）を fail で検出する。
  # yarn 側の Yarn Resolutions Inventory と同じく、判定材料（上流のリリース）は週次でしか
  # 変わらず、再解決コストを毎 PR で払う価値がないため schedule / 手動実行に限定する
  npm-overrides-inventory:
    name: npm Overrides Inventory
    if: >-
      ${{
        (inputs.package-manager || 'yarn') == 'yarn' &&
        github.repository == 'kmryst/idp-golden-path' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check npm overrides inventory (stale)
        run: node scripts/ci/npm-overrides-audit.mjs stale
